<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7EE"/>
      <stop offset="100%" stop-color="#EFE8D6"/>
    </linearGradient>
    <linearGradient id="pepperRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="70%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="pepperGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="160" cy="195" rx="65" ry="12" fill="#253129" opacity="0.12"/>
  <!-- Tallo verde -->
  <path d="M150 70 C150 50, 160 40, 170 35" stroke="#15803D" stroke-width="5" stroke-linecap="round"/>
  <path d="M135 70 C145 65, 160 65, 170 70 L165 78 L140 78 Z" fill="#15803D"/>
  <!-- Ají gustoso rojo -->
  <path d="M140 75 C180 75, 195 110, 185 145 C175 180, 160 190, 155 190 C150 190, 135 180, 125 145 C115 110, 120 75, 140 75 Z" fill="url(#pepperRed)"/>
  <ellipse cx="140" cy="120" rx="10" ry="25" fill="#FFFFFF" opacity="0.35" transform="rotate(-15 140 120)"/>
  <!-- Ají verde secundario detrás -->
  <path d="M185 105 C215 105, 225 130, 218 155 C210 180, 200 185, 195 185 C190 185, 180 180, 172 155 Z" fill="url(#pepperGreen)" opacity="0.85"/>
  <rect x="20" y="20" width="70" height="24" rx="12" fill="#245C3A" opacity="0.9"/>
  <text x="55" y="36" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">VEGETAL</text>
</svg>
