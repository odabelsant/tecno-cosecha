      <stop offset="0%" stop-color="#FBF7EE"/>
      <stop offset="100%" stop-color="#EFE8D6"/>
    </linearGradient>
    <linearGradient id="podGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#3F6212"/>
    </linearGradient>
    <linearGradient id="beanRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="160" cy="195" rx="75" ry="12" fill="#253129" opacity="0.12"/>
