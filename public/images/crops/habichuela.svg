  <ellipse cx="155" cy="145" rx="20" ry="14" fill="#7F1D1D" transform="rotate(-5 155 145)"/>
  <circle cx="155" cy="142" r="3.5" fill="#FEF2F2" opacity="0.8"/>
  <rect x="20" y="20" width="70" height="24" rx="12" fill="#245C3A" opacity="0.9"/>
  <text x="55" y="36" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">GRANOS</text>
</svg>
