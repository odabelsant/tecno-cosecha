      <stop offset="0%" stop-color="#FBF7EE"/>
      <stop offset="100%" stop-color="#EFE8D6"/>
    </linearGradient>
    <linearGradient id="batataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C026D3"/>
      <stop offset="50%" stop-color="#86198F"/>
      <stop offset="100%" stop-color="#4A044E"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="160" cy="195" rx="70" ry="12" fill="#253129" opacity="0.12"/>
  <!-- Batata morada fusiforme -->
  <path d="M80 145 C120 100, 190 105, 240 145 C200 185, 120 180, 80 145 Z" fill="url(#batataGrad)"/>
  <!-- Textura y doblez natural -->
