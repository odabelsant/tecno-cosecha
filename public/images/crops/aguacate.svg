<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7EE"/>
      <stop offset="100%" stop-color="#EFE8D6"/>
    </linearGradient>
    <linearGradient id="avocadoSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#365314"/>
      <stop offset="100%" stop-color="#142609"/>
    </linearGradient>
    <linearGradient id="avocadoFlesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BEF264"/>
      <stop offset="60%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>
    <linearGradient id="seedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="160" cy="195" rx="65" ry="12" fill="#253129" opacity="0.12"/>
  <!-- Aguacate Semil-34 mitad cortada -->
  <!-- Cáscara verde oscura -->
  <path d="M160 65 C185 65, 205 95, 210 135 C215 175, 190 195, 160 195 C130 195, 105 175, 110 135 C115 95, 135 65, 160 65 Z" fill="url(#avocadoSkin)"/>
  <!-- Masa cremosa amarilla-verde -->
  <path d="M160 72 C180 72, 198 98, 202 133 C206 168, 185 188, 160 188 C135 188, 114 168, 118 133 C122 98, 140 72, 160 72 Z" fill="url(#avocadoFlesh)"/>
  <!-- Semilla grande redonda -->
  <circle cx="160" cy="148" r="26" fill="url(#seedGrad)"/>
  <ellipse cx="152" cy="140" rx="8" ry="12" fill="#FFFFFF" opacity="0.25" transform="rotate(-20 152 140)"/>
  <rect x="20" y="20" width="70" height="24" rx="12" fill="#245C3A" opacity="0.9"/>
  <text x="55" y="36" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FRUTAS</text>
</svg>
