<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7EE"/>
      <stop offset="100%" stop-color="#EFE8D6"/>
    </linearGradient>
    <linearGradient id="yucaSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#271101"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="160" cy="195" rx="75" ry="12" fill="#253129" opacity="0.12"/>
  <!-- Tubérculo de Yuca alargado -->
  <path d="M70 145 C120 120, 200 120, 245 135 C230 160, 150 170, 75 160 Z" fill="url(#yucaSkin)"/>
  <!-- Corte transversal blanco mostrando la masa fresca -->
  <ellipse cx="75" cy="152" rx="14" ry="18" fill="#FFFFFF" stroke="#451A03" stroke-width="3" transform="rotate(-15 75 152)"/>
  <circle cx="75" cy="152" r="2" fill="#D97706"/>
  <!-- Textura de cáscara rugosa -->
  <line x1="120" y1="135" x2="128" y2="155" stroke="#92400E" stroke-width="2"/>
  <line x1="170" y1="130" x2="175" y2="155" stroke="#92400E" stroke-width="2"/>
  <line x1="210" y1="132" x2="216" y2="148" stroke="#92400E" stroke-width="2"/>
  <rect x="20" y="20" width="80" height="24" rx="12" fill="#245C3A" opacity="0.9"/>
  <text x="60" y="36" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TUBÉRCULO</text>
</svg>
