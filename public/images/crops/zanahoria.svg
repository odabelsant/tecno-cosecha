<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7EE"/>
      <stop offset="100%" stop-color="#EFE8D6"/>
    </linearGradient>
    <linearGradient id="carrot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="leaves" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="160" cy="195" rx="60" ry="10" fill="#253129" opacity="0.12"/>
  <!-- Hojas verdes -->
  <path d="M125 70 C110 40, 100 25, 90 20 C105 35, 115 50, 125 70 Z" fill="url(#leaves)"/>
  <path d="M135 65 C135 30, 130 15, 125 10 C140 25, 140 45, 135 65 Z" fill="url(#leaves)"/>
  <path d="M145 70 C160 40, 170 25, 180 20 C165 35, 155 50, 145 70 Z" fill="url(#leaves)"/>
  <!-- Cuerpo de la Zanahoria en diagonal -->
  <path d="M115 70 C140 60, 155 75, 150 85 L220 185 C222 188, 218 190, 215 186 L115 85 C110 80, 110 75, 115 70 Z" fill="url(#carrot)"/>
  <!-- Rayas de textura -->
  <line x1="135" y1="95" x2="148" y2="92" stroke="#7C2D12" stroke-width="2" stroke-linecap="round"/>
  <line x1="150" y1="120" x2="168" y2="116" stroke="#7C2D12" stroke-width="2" stroke-linecap="round"/>
  <line x1="172" y1="145" x2="188" y2="141" stroke="#7C2D12" stroke-width="2" stroke-linecap="round"/>
  <rect x="20" y="20" width="70" height="24" rx="12" fill="#245C3A" opacity="0.9"/>
  <text x="55" y="36" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">VEGETAL</text>
</svg>
