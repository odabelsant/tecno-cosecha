<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7EE"/>
      <stop offset="100%" stop-color="#EFE8D6"/>
    </linearGradient>
    <linearGradient id="bananaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="50%" stop-color="#4D7C0F"/>
      <stop offset="100%" stop-color="#1E3A1A"/>
    </linearGradient>
    <linearGradient id="bananaYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="70%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="160" cy="200" rx="80" ry="12" fill="#253129" opacity="0.12"/>
  <!-- Plátano 1 (Curva verde criolla) -->
  <path d="M70 90 C120 180, 210 180, 250 110 C210 160, 130 160, 80 82 Z" fill="url(#bananaGreen)"/>
  <path d="M70 90 L60 85 L65 78 L75 82 Z" fill="#365314"/>
  <!-- Plátano 2 (En primer plano pintón) -->
  <path d="M90 110 C140 195, 230 190, 265 125 C225 175, 150 175, 98 102 Z" fill="url(#bananaYellow)" opacity="0.95"/>
  <path d="M90 110 L80 105 L85 98 L95 102 Z" fill="#713F12"/>
  <!-- Punta marrón -->
  <circle cx="265" cy="125" r="4" fill="#3E2723"/>
  <rect x="20" y="20" width="80" height="24" rx="12" fill="#245C3A" opacity="0.9"/>
  <text x="60" y="36" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TUBÉRCULO</text>
</svg>
