<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7EE"/>
      <stop offset="100%" stop-color="#EFE8D6"/>
    </linearGradient>
    <linearGradient id="chinolaSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="160" cy="195" rx="65" ry="12" fill="#253129" opacity="0.12"/>
  <!-- Chinola entera amarilla detrás -->
  <circle cx="130" cy="135" r="45" fill="url(#chinolaSkin)"/>
  <!-- Tallo -->
  <path d="M125 90 C125 75, 130 68, 135 60" stroke="#4D7C0F" stroke-width="4" stroke-linecap="round"/>
  <!-- Chinola partida abierta al frente -->
  <circle cx="185" cy="145" r="42" fill="#FEF08A" stroke="#CA8A04" stroke-width="6"/>
  <!-- Pulpa con semillas negras aromáticas -->
  <circle cx="185" cy="145" r="32" fill="#F59E0B"/>
  <circle cx="175" cy="135" r="3.5" fill="#18181B"/>
  <circle cx="195" cy="132" r="3" fill="#18181B"/>
  <circle cx="185" cy="150" r="3.5" fill="#18181B"/>
  <circle cx="170" cy="155" r="3" fill="#18181B"/>
  <circle cx="198" cy="158" r="3" fill="#18181B"/>
  <rect x="20" y="20" width="70" height="24" rx="12" fill="#245C3A" opacity="0.9"/>
  <text x="55" y="36" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FRUTAS</text>
</svg>
